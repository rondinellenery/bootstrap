<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudando Bootstrap com Versel e bibliotecas</title>
    <style>
        #alternar-tema {
            position: fixed;
            right: 16px;
            bottom: 16px;
            z-index: 1030;
            width: 48px;
            height: 48px;
            padding: 4px;
            display: grid;
            place-items: center;
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Geração Tech</a>

            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent"
                aria-controls="navbarSupportedContent"
                aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse"
                        id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active"
                        aria-current="page" href="#">Início</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Link</a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown"
                            aria-expanded="false">
                            Edições
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="#">1.0</a></li>
                            <li><a class="dropdown-item" href="#">2.0</a></li>
                            <li><a class="dropdown-item" href="#">3.0</a></li>
                            <li><a class="dropdown-item" href="#">4.0</a></li>
                            <li><a class="dropdown-item" href="#">5.0</a></li>
                            <li><a class="dropdown-item" href="#">6.0</a></li>
                            <li>
                                <hr class="dropdown-divider">
                            </li>
                            <li><a class="dropdown-item" href="#">Fale com a coordenação</a></li>
                        </ul>
                    </li>
                </ul>
                <form class="d-flex" role="search">
                    <input class="form-control me-2" type="search" placeholder="Digite sua pesquisa..." aria-label="Search" />
                    <button class="btn btn-outline-success" type="submit">Procurar</button>
                </form>
            </div>
        </div>
    </nav>

    <button id="alternar-tema" class="btn bg-body border rounded-circle shadow-sm"
        type="button" aria-label="Modo escuro" aria-pressed="true">
        <img id="imagem-chave" src="images/chave-ligada.svg" width="40" height="28" alt="">
    </button>

    <script>
        const botaoTema = document.getElementById('alternar-tema');
        const imagemChave = document.getElementById('imagem-chave');

        botaoTema.addEventListener('click', function () {
            // O Bootstrap aplica o tema escolhido a toda a página.
            const ligarModoEscuro = document.documentElement.getAttribute('data-bs-theme') !== 'dark';
            document.documentElement.setAttribute('data-bs-theme', ligarModoEscuro ? 'dark' : 'light');

            imagemChave.src = ligarModoEscuro ? 'images/chave-ligada.svg' : 'images/chave-desligada.svg';
            botaoTema.setAttribute('aria-pressed', String(ligarModoEscuro));
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
